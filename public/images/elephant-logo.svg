<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Elephant logo</title>
  <!-- Black background -->
  <rect width="100" height="100" rx="20" fill="#000"/>
  <g transform="translate(-2 -2)">
  <g fill="#fff">
    <!-- Tail -->
    <path d="M22 44 Q14 50 16 60" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="20" y="32" width="52" height="34" rx="17"/>
    <!-- Legs -->
    <rect x="24" y="54" width="10" height="24" rx="3"/>
    <rect x="37" y="56" width="9" height="22" rx="3"/>
    <rect x="52" y="56" width="9" height="22" rx="3"/>
    <rect x="63" y="54" width="10" height="24" rx="3"/>
    <!-- Head -->
    <circle cx="72" cy="40" r="15"/>
    <!-- Trunk -->
    <path d="M82 44 Q88 58 86 70 Q85 76 79 74" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Ear (outlined so it stands out from the head) -->
  <path d="M66 30 Q54 34 56 46 Q58 56 68 52" fill="#fff" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="78" cy="36" r="2.2" fill="#000"/>
  <!-- Tusk -->
  <path d="M78 50 Q74 56 68 56" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
